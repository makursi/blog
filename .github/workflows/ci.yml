name: Shirone CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      comments: ${{ steps.filter.outputs.comments }}
      styles: ${{ steps.filter.outputs.styles }}
    steps:
      - name: Checkout history for path detection
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # Manual runs and new branch pushes deliberately run every suite.
          if [[ "$EVENT_NAME" == "workflow_dispatch" || "$BEFORE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            echo "comments=true" >> "$GITHUB_OUTPUT"
            echo "styles=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$BASE_SHA"
            head="$CURRENT_SHA" # the checked-out PR merge commit
          else
            base="$BEFORE_SHA"
            head="$CURRENT_SHA"
          fi

          # Keep the classifier separately testable; it reads Git's NUL-delimited
          # path list without passing it through command substitution.
          scripts/ci/classify-browser-suites.sh "$base" "$head" "$GITHUB_OUTPUT"

  quality:
    name: Code quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # Omit the version so the action reads `packageManager` from package.json.
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Biome
        continue-on-error: true
        run: pnpm exec biome ci ./src --reporter=github

  checks:
    name: Diagnostics and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # Omit the version so the action reads `packageManager` from package.json.
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ── fork 本地补丁（ADR-0004）：取回上游 demo 内容，让上游原版的校验在本仓能跑 ──
      # 内容分离后本仓新克隆里没有「物化路径」（.gitignore:77-78 等），而主题源码对其中一部分是
      # **静态 import**（`src/data/*.ts`、`src/user/user-config.ts`）⇒ 上游原版的 astro check / pnpm build
      # 在本仓**必挂**（§M3 实测：`Could not resolve "../user/user-config.ts"`）。
      # 这里从 upstream 取回 **demo 内容**兜底：CI 只验代码，不需要、也不应该碰私密内容仓
      # （所以**不**配 CONTENT_REPO_URL）。若上游新增了别的物化路径而此处漏列，下面的 `test -f` 会
      # **大声**失败而不是静默放过。
      - name: Materialize upstream demo content
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/LyraVoid/Shirone.git 2>/dev/null || true
          git fetch --depth=1 upstream main
          git checkout upstream/main -- \
            src/content src/data src/user src/assets/images \
            public/images public/assets src/config/FooterConfig.html
          test -f src/user/user-config.ts
          echo "restored $(git diff --cached --name-only | wc -l) demo files from upstream/main"

      - name: Check Astro diagnostics
        run: pnpm exec astro check

      - name: Check Svelte diagnostics
        run: pnpm exec svelte-check --tsconfig ./tsconfig.json

      - name: Validate atom manifest
        run: pnpm check:manifest

      - name: Run unit tests
        run: node --test "tests/**/*.test.mjs"

  build:
    name: Build (Node.js ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [26.13.0]
    env:
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # Omit the version so the action reads `packageManager` from package.json.
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 同 checks job：先取回上游 demo 内容，否则 `pnpm build` 在本仓必挂（§M3 / ADR-0004）。
      - name: Materialize upstream demo content
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/LyraVoid/Shirone.git 2>/dev/null || true
          git fetch --depth=1 upstream main
          git checkout upstream/main -- \
            src/content src/data src/user src/assets/images \
            public/images public/assets src/config/FooterConfig.html
          test -f src/user/user-config.ts
          echo "restored $(git diff --cached --name-only | wc -l) demo files from upstream/main"

      - name: Build production site
        run: pnpm build

  comment-tests:
    name: Comment regression fixtures
    needs: changes
    if: needs.changes.outputs.comments == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mode: [disabled, waline, twikoo, no-toc]
    env:
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # Omit the version so the action reads `packageManager` from package.json.
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 同 checks job：本仓不跟踪 demo 内容，而 Playwright 要渲染真实页面（§M3 / ADR-0004）。
      # fixture 只带 config 覆盖层，不带文章与数据，所以必须先取回上游 demo 内容。
      - name: Materialize upstream demo content
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/LyraVoid/Shirone.git 2>/dev/null || true
          git fetch --depth=1 upstream main
          git checkout upstream/main -- \
            src/content src/data src/user src/assets/images \
            public/images public/assets src/config/FooterConfig.html
          test -f src/user/user-config.ts
          echo "restored $(git diff --cached --name-only | wc -l) demo files from upstream/main"

      # Comments are off by default, so this run covers the zero-footprint cases.
      - name: Run comment, content, a11y and swup container regressions with comments disabled
        if: matrix.mode == 'disabled'
        run: pnpm exec playwright test tests/site/comments.spec.ts tests/site/waline.spec.ts tests/site/mdx.spec.ts tests/site/a11y.spec.ts tests/site/swup-navigation.spec.ts

      # The fixture enables Waline through the content-repository config overlay;
      # the specs mock its SDK, stylesheet, emoji packs and API.
      - name: Enable the Waline fixture
        if: matrix.mode == 'waline'
        run: pnpm content:sync
        env:
          CONTENT_DIR: tests/fixtures/content/waline

      - name: Run comment regressions with Waline enabled
        if: matrix.mode == 'waline'
        run: pnpm exec playwright test tests/site/comments.spec.ts tests/site/waline.spec.ts

      # The Twikoo fixture matches the SDK mock in comments.spec.ts.
      - name: Enable the Twikoo fixture
        if: matrix.mode == 'twikoo'
        run: pnpm content:sync
        env:
          CONTENT_DIR: tests/fixtures/content/twikoo

      - name: Run comment regressions with Twikoo enabled
        if: matrix.mode == 'twikoo'
        run: pnpm exec playwright test tests/site/comments.spec.ts

      # The fixture turns the TOC sidebar widget off, the configuration where
      # the layout's fallback #toc container is the only thing keeping swup
      # navigation soft; the spec's default-configuration cases skip there.
      - name: Enable the no-toc fixture
        if: matrix.mode == 'no-toc'
        run: pnpm content:sync
        env:
          CONTENT_DIR: tests/fixtures/content/no-toc

      - name: Run swup container regressions with the TOC widget disabled
        if: matrix.mode == 'no-toc'
        run: pnpm exec playwright test tests/site/swup-navigation.spec.ts

  comments:
    # Keep the required check name stable for branch protection.
    name: Comment regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [changes, comment-tests]
    if: always()
    steps:
      - name: Verify comment regression result
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          SHOULD_RUN: ${{ needs.changes.outputs.comments }}
          TEST_RESULT: ${{ needs.comment-tests.result }}
        run: |
          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "::error::Changed-path detection did not succeed ($CHANGES_RESULT)."
            exit 1
          fi
          if [[ "$SHOULD_RUN" != "true" && "$SHOULD_RUN" != "false" ]]; then
            echo "::error::Changed-path detection produced an invalid comments value."
            exit 1
          fi
          if [[ "$SHOULD_RUN" == "true" && "$TEST_RESULT" != "success" ]]; then
            echo "::error::Comment regression matrix did not succeed ($TEST_RESULT)."
            exit 1
          fi
          echo "Comment regression check passed (suite selected: $SHOULD_RUN)."

  styles:
    name: Style regressions
    needs: changes
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: true

    steps:
      - name: Fail if changed-path detection did not succeed
        if: needs.changes.result != 'success'
        run: |
          echo "::error::Changed-path detection did not succeed (${{ needs.changes.result }})."
          exit 1

      - name: Fail if changed-path detection output is invalid
        if: needs.changes.result == 'success' && needs.changes.outputs.styles != 'true' && needs.changes.outputs.styles != 'false'
        run: |
          echo "::error::Changed-path detection produced an invalid styles value."
          exit 1

      - name: Skip style regressions for unrelated changes
        if: needs.changes.outputs.styles != 'true'
        run: echo "No changed paths require the style suite; install, diagnostics and builds still run."

      - name: Checkout
        if: needs.changes.outputs.styles == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        if: needs.changes.outputs.styles == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # Omit the version so the action reads `packageManager` from package.json.
          run_install: false

      - name: Set up Node.js
        if: needs.changes.outputs.styles == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        if: needs.changes.outputs.styles == 'true'
        run: pnpm install --frozen-lockfile

      # 同 checks job：Playwright 要渲染真实页面，本仓不跟踪 demo 内容（§M3 / ADR-0004）。
      - name: Materialize upstream demo content
        if: needs.changes.outputs.styles == 'true'
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/LyraVoid/Shirone.git 2>/dev/null || true
          git fetch --depth=1 upstream main
          git checkout upstream/main -- \
            src/content src/data src/user src/assets/images \
            public/images public/assets src/config/FooterConfig.html
          test -f src/user/user-config.ts
          echo "restored $(git diff --cached --name-only | wc -l) demo files from upstream/main"

      - name: Run style, banner and theme scheme regressions
        if: needs.changes.outputs.styles == 'true'
        run: pnpm exec playwright test tests/site/fonts.spec.ts tests/site/inline-code-emphasis.spec.ts tests/site/banner.spec.ts tests/site/theme-scheme.spec.ts
