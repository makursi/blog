name: Shirone CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Code quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 9.14.4
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Biome
        continue-on-error: true
        run: pnpm exec biome ci ./src --reporter=github

  checks:
    name: Diagnostics and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 9.14.4
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ── fork 本地补丁（ADR-0004）：取回上游 demo 内容，让上游原版的校验在本仓能跑 ──
      # 内容分离后本仓新克隆里没有「物化路径」（.gitignore:77-78 等），而主题源码对其中一部分是
      # **静态 import**（`src/data/*.ts`、`src/user/user-config.ts`）⇒ 上游原版的 astro check / pnpm build
      # 在本仓**必挂**（§M3 实测：`Could not resolve "../user/user-config.ts"`）。
      # 这里从 upstream 取回 **demo 内容**兜底：CI 只验代码，不需要、也不应该碰私密内容仓
      # （所以**不**配 CONTENT_REPO_URL）。若上游新增了别的物化路径而此处漏列，下面的 `test -f` 会
      # **大声**失败而不是静默放过。
      - name: Materialize upstream demo content
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/LyraVoid/Shirone.git 2>/dev/null || true
          git fetch --depth=1 upstream main
          git checkout upstream/main -- \
            src/content src/data src/user src/assets/images \
            public/images public/assets src/config/FooterConfig.html
          test -f src/user/user-config.ts
          echo "restored $(git diff --cached --name-only | wc -l) demo files from upstream/main"

      - name: Check Astro diagnostics
        run: pnpm exec astro check

      - name: Validate atom manifest
        run: pnpm check:manifest

      - name: Run unit tests
        run: node --test "tests/**/*.test.mjs"

  build:
    name: Build (Node.js ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    env:
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 9.14.4
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 同 checks job：先取回上游 demo 内容，否则 `pnpm build` 在本仓必挂（§M3 / ADR-0004）。
      - name: Materialize upstream demo content
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/LyraVoid/Shirone.git 2>/dev/null || true
          git fetch --depth=1 upstream main
          git checkout upstream/main -- \
            src/content src/data src/user src/assets/images \
            public/images public/assets src/config/FooterConfig.html
          test -f src/user/user-config.ts
          echo "restored $(git diff --cached --name-only | wc -l) demo files from upstream/main"

      - name: Build production site
        run: pnpm build
